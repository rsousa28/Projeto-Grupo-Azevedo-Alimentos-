<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Executive Canvas -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />

  <!-- Outer Metallic Gold Border -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.85" />

  <!-- Geometric Crest Diamond -->
  <polygon points="256,70 410,256 256,442 102,256" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.4" />

  <!-- Luxury Monogram Emblem "A" -->
  <path d="
    M 256 120
    L 350 350
    C 350 360, 360 370, 380 370
    L 300 370
    C 315 370, 325 360, 320 350
    L 305 310
    L 207 310
    L 192 350
    C 187 360, 197 370, 212 370
    L 132 370
    C 152 370, 162 360, 162 350
    L 256 120
    Z

    M 256 180
    L 222 270
    L 290 270
    L 256 180
    Z
  " fill="url(#goldGrad)" filter="url(#goldGlow)" />

  <!-- Crown Top Accent -->
  <polygon points="256,85 272,112 240,112" fill="url(#goldGrad)" />

  <!-- Brand Subtitle -->
  <text x="256" y="420" text-anchor="middle" fill="#FFFFFF" font-family="'Playfair Display', serif, sans-serif" font-size="28" font-weight="700" letter-spacing="10" opacity="0.95">
    GRUPO AZEVEDO
  </text>
  <text x="256" y="445" text-anchor="middle" fill="#F59E0B" font-family="sans-serif" font-size="12" font-weight="600" letter-spacing="6" opacity="0.8">
    GESTAO & EMPREENDIMENTOS
  </text>
</svg>
